services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: venturex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-venturex_local}
      POSTGRES_DB: venturex
    ports: ["127.0.0.1:5434:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venturex"]
      interval: 5s
      retries: 10
    mem_limit: 512m
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6381:6379"]
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 128m
volumes:
  postgres_data:
